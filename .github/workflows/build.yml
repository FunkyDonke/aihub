name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate App Icons
        run: |
          sudo apt-get install -y imagemagick
          declare -A sizes
          sizes["mdpi"]=48
          sizes["hdpi"]=72
          sizes["xhdpi"]=96
          sizes["xxhdpi"]=144
          sizes["xxxhdpi"]=192
          for density in "${!sizes[@]}"; do
            size=${sizes[$density]}
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert -size ${size}x${size} \
              gradient:"#6750A4-#B69DF8" \
              -gravity center \
              -fill white \
              -pointsize $((size/3)) \
              -annotate 0 "AI" \
              "${dir}/ic_launcher.png"
            convert -size ${size}x${size} \
              gradient:"#6750A4-#B69DF8" \
              -gravity center \
              -fill white \
              -pointsize $((size/3)) \
              -annotate 0 "AI" \
              "${dir}/ic_launcher_round.png"
          done

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-Debug
          path: app/build/outputs/apk/debug/*.apk
